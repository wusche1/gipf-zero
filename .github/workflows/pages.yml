name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Version browser assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          page = Path('web/index.html')
          html = page.read_text()
          for asset in ('styles.css', 'app.js', 'gipf_engine.js'):
              html = re.sub(re.escape(asset) + r'(?:\?v=[^"\s]*)?(?=")', asset + '?v=' + os.environ['ASSET_VERSION'], html)
          page.write_text(html)
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
